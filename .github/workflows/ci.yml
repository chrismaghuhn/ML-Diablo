name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src/dxai
      - run: pytest -q
      - run: python scripts/validate_artifacts.py
      - run: python scripts/check_no_assets.py
      - run: PYTHONPATH=src python -m dxai smoke --episodes 1 --agent heuristic

  cpp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S engine_adapter -B build/bridge -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/bridge --config Release --parallel
      - run: ctest --test-dir build/bridge -C Release --output-on-failure
